<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080510">
<meta name="description" content="Happy Monthsary">
<title>Happy Monthsary</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=2">
<script src="app.js?v=2" defer></script>
</head>
<body>
<main class="scene">
<div class="aurora" aria-hidden="true"></div>
<div id="starlight" aria-hidden="true"></div>
<h1>Happy <em>Monthsary</em></h1>
<div class="bouquet">
<svg id="garden" viewBox="0 0 800 850" role="img" aria-label="White and purple tulips growing, opening, and gently swaying in a sparkling night garden">
<defs id="paints">
<linearGradient id="stem" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#153f3c"/><stop offset=".6" stop-color="#519982"/><stop offset="1" stop-color="#a9d9b6"/></linearGradient>
<linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#123e36"/><stop offset=".55" stop-color="#40826b"/><stop offset="1" stop-color="#8cbfa0"/></linearGradient>
<radialGradient id="ground"><stop stop-color="#ad72ed" stop-opacity=".22"/><stop offset="1" stop-color="#ad72ed" stop-opacity="0"/></radialGradient>
</defs>
<ellipse class="ground" cx="400" cy="784" rx="280" ry="46" fill="url(#ground)"/>
<g id="tulips"></g><g id="fireflies" aria-hidden="true"></g>
</svg>
</div>
<div id="petal-rain" aria-hidden="true"></div><div id="bursts" aria-hidden="true"></div>
</main>
</body>
</html>
